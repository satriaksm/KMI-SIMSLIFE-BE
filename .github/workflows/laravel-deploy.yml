name: Deploy Backend to Server

on:
  push:
    branches: [staging]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare target dir
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            set -Eeuo pipefail
            sudo mkdir -p /var/www/KMI-SIMSLIFE-BE
            # berikan ke user SSH agar langkah berikut bisa tulis
            sudo chown -R "$USER:$USER" /var/www/KMI-SIMSLIFE-BE

      - name: Upload app to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          overwrite: true
          target: /var/www/KMI-SIMSLIFE-BE
          source: app,bootstrap,config,database,public,resources,routes,artisan,composer.json,composer.lock

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          debug: true
          command_timeout: 30m
          script: |
            set -Eeuo pipefail
            REPO_DIR=/var/www/KMI-SIMSLIFE-BE
            cd "$REPO_DIR"

            # 1) Siapkan folder yang diperlukan + izin sebelum composer/artisan
            mkdir -p storage/{app,framework/{cache,sessions,views},logs} bootstrap/cache
            # pastikan user SSH bisa tulis saat menjalankan artisan/composer
            chown -R "$USER:$USER" storage bootstrap/cache
            chmod -R ug+rwX storage bootstrap/cache
            touch storage/logs/laravel.log || true
            chmod 664 storage/logs/laravel.log || true

            # 2) Install vendor (package:discover akan menulis ke bootstrap/cache)
            composer install --prefer-dist --no-interaction --optimize-autoloader --no-dev

            # 3) Jalankan artisan (cache clear lalu migrate)
            php artisan optimize:clear
            php artisan migrate --force

            # 4) Build cache untuk performa
            php artisan config:cache
            php artisan route:cache

            # 5) Serahkan izin runtime ke www-data (PHP-FPM)
            sudo chown -R www-data:www-data storage bootstrap/cache
            sudo find storage -type d -exec chmod 775 {} \;
            sudo find storage -type f -exec chmod 664 {} \;
            sudo chmod -R ug+rwX bootstrap/cache

            # 6) Reload services
            sudo systemctl reload php8.3-fpm || sudo systemctl restart php8.3-fpm
            sudo systemctl reload nginx || sudo systemctl restart nginx
