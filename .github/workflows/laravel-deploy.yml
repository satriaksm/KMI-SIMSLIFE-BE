name: Deploy Backend to Server

on:
  push:
    branches: [staging]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, bcmath, xml, ctype, json, curl, tokenizer, mysql
          coverage: none

      - name: Install Composer dependencies
        run: |
          composer install --no-dev --optimize-autoloader

      - name: Generate Laravel key & optimize
        run: |
          php artisan config:cache
          php artisan route:cache

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          debug: true
          command_timeout: 30m
          script: |
            set -Eeuo pipefail
            REPO_DIR=/var/www/KMI-SIMSLIFE-BE

            whoami
            hostname

            # Pastikan kepemilikan dan izin benar
            sudo chown -R "$USER:$USER" "$REPO_DIR"
            git config --global --add safe.directory "$REPO_DIR"

            cd "$REPO_DIR"
            pwd

            test -d .git || { echo "Not a git repo at $(pwd)"; exit 1; }
            git remote -v
            git fetch --all --prune
            git checkout -f staging
            git reset --hard origin/staging
            git clean -fd

            composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            sudo systemctl reload php8.3-fpm || sudo systemctl restart php8.3-fpm
            sudo systemctl reload nginx || sudo systemctl restart nginx
