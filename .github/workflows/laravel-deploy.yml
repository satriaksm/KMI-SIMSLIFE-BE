name: Laravel CI/CD -> FTPS (upload release)

on:
  push:
    branches: [staging]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, bcmath, openssl, pdo_mysql, tokenizer, xml, fileinfo
          ini-values: post_max_size=256M, upload_max_filesize=256M, memory_limit=1024M

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('**/composer.lock') }}

      - name: Install composer dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Prepare release folder
        run: |
          rm -rf release || true
          mkdir -p release
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='public' \
            --exclude='.env' \
            ./ release/
          rsync -av vendor/ release/vendor/
          mkdir -p release/storage release/bootstrap/cache
          ls -la release

      - name: Deploy release (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASS }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftps
          local-dir: release
          server-dir: ${{ secrets.FTP_PATH_LARAVEL }}
          # optional: passive mode and other args can be added if needed
