name: Laravel CI/CD -> SFTP (zip upload)

on:
  push:
    branches: [staging]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add SSH known hosts
        run: |
          mkdir -p ~/.ssh
          if [ -n "${{ secrets.SSH_KNOWN_HOSTS }}" ]; then
            echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${{ secrets.FTP_PORT }}" "${{ secrets.FTP_SERVER }}" >> ~/.ssh/known_hosts
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Setup SSH key
        run: |
          echo "${{ secrets.FTP_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: mbstring, bcmath, openssl, pdo_mysql, tokenizer, xml, fileinfo

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('**/composer.lock') }}

      - name: Install composer dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Prepare release folder
        run: |
          rm -rf release || true
          mkdir -p release
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='public' \
            --exclude='.env' \
            ./ release/
          rsync -av vendor/ release/vendor/
          mkdir -p release/storage release/bootstrap/cache
          ls -la release

      - name: Zip release
        run: |
          cd release
          zip -r ../release.zip . >/dev/null
          cd ..
          ls -lh release.zip

      - name: Upload release.zip to server (SCP)
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          key: ${{ secrets.FTP_SSH_KEY }}
          port: ${{ secrets.FTP_PORT }}
          source: "release.zip"
          target: "/tmp"

      - name: Unzip on server and move to target
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          key: ${{ secrets.FTP_SSH_KEY }}
          port: ${{ secrets.FTP_PORT }}
          script: |
            set -e
            TARGET_DIR="${{ secrets.FTP_PATH_LARAVEL }}"
            # create target dir if not exists
            mkdir -p "$TARGET_DIR"
            # backup existing folder (optional)
            if [ -d "$TARGET_DIR" ]; then
              mv "$TARGET_DIR" "${TARGET_DIR}_backup_$(date +%s)" || true
            fi
            # unzip into target
            unzip -o /tmp/release.zip -d "$TARGET_DIR"
            # cleanup
            rm -f /tmp/release.zip
            # set permissive permissions for storage & cache
            chmod -R 775 "$TARGET_DIR/storage" "$TARGET_DIR/bootstrap/cache" || true
            echo "Deployed to $TARGET_DIR"

      - name: Run post-deploy commands (composer migrate + optimize)
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          key: ${{ secrets.FTP_SSH_KEY }}
          port: ${{ secrets.FTP_PORT }}
          script: |
            set -e
            cd "${{ secrets.FTP_PATH_LARAVEL }}"
            # jika vendor belum terinstall di server, lakukan composer install (opsional)
            composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader || true
            php artisan migrate --force || true
            php artisan config:cache || true
            php artisan route:cache || true
            php artisan view:cache || true
            echo "Post-deploy tasks done."
