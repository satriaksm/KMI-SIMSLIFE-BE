name: Laravel CI/CD -> FTPS

on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, bcmath, openssl, pdo_mysql, tokenizer, xml, fileinfo
          ini-values: post_max_size=256M, upload_max_filesize=256M, memory_limit=1024M

      - name: Prepare release folder
        run: |
          rm -rf release || true
          mkdir -p release

          # ✅ Copy source code (exclude vendor, node_modules, tests, etc)
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='vendor' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='public' \
            --exclude='.env' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            ./ release/

          # ✅ Create necessary directories
          mkdir -p release/storage/{app,framework,logs}
          mkdir -p release/storage/framework/{cache,sessions,views}
          mkdir -p release/bootstrap/cache

          echo "📦 Release contents:"
          ls -lah release/
          echo ""
          echo "📊 Release size:"
          du -sh release/

      - name: Deploy to FTPS (Source Code)
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASS }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftps
          passive: true
          local-dir: release/
          server-dir: ${{ secrets.FTP_PATH_LARAVEL }}/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/vendor/**
            **/tests/**
            **/.env

      - name: Deploy public folder to /api
        run: |
          echo "📂 Preparing public folder for /api deployment..."
          mkdir -p public-deploy
          rsync -av public/ public-deploy/
          ls -la public-deploy/

      - name: Deploy to FTPS (Public -> /api)
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASS }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftps
          passive: true
          local-dir: public-deploy/
          server-dir: ${{ secrets.FTP_PATH_PUBLIC }}/api/
          dangerous-clean-slate: false

      - name: Run post-deployment via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "🚀 Running post-deployment tasks..."

            cd ${{ secrets.FTP_PATH_LARAVEL }}

            # ✅ Install composer dependencies di server
            echo "📦 Installing Composer dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction

            # ✅ Update index.php paths (if needed)
            echo "🔧 Updating API index.php paths..."
            sed -i "s|__DIR__.'/../vendor/autoload.php'|__DIR__.'/../../laravel_app/vendor/autoload.php'|g" ${{ secrets.FTP_PATH_PUBLIC }}/api/index.php
            sed -i "s|__DIR__.'/../bootstrap/app.php'|__DIR__.'/../../laravel_app/bootstrap/app.php'|g" ${{ secrets.FTP_PATH_PUBLIC }}/api/index.php

            # ✅ Set permissions
            echo "🔐 Setting permissions..."
            chmod -R 775 storage bootstrap/cache

            # ✅ Create storage link
            echo "🔗 Creating storage link..."
            php artisan storage:link --force

            # ✅ Run migrations
            echo "📊 Running migrations..."
            php artisan migrate --force

            # ✅ Clear and cache config
            echo "🧹 Clearing caches..."
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            php artisan cache:clear

            echo "⚡ Caching config..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "✅ Optimization..."
            php artisan optimize

            echo "✅ Deployment completed successfully!"

      - name: Deployment Summary
        if: success()
        run: |
          echo "### ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Message:** ${{ github.event.head_commit.message }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📂 **Deployed to:**" >> $GITHUB_STEP_SUMMARY
          echo "- Laravel: ${{ secrets.FTP_PATH_LARAVEL }}/" >> $GITHUB_STEP_SUMMARY
          echo "- Public API: ${{ secrets.FTP_PATH_PUBLIC }}/api/" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🌐 **URLs:**" >> $GITHUB_STEP_SUMMARY
          echo "- API Health: https://sumilir.web.id/api/health" >> $GITHUB_STEP_SUMMARY
          echo "- API Docs: https://sumilir.web.id/api/docs" >> $GITHUB_STEP_SUMMARY

      - name: Deployment Failed
        if: failure()
        run: |
          echo "### ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please check the logs above for details." >> $GITHUB_STEP_SUMMARY
