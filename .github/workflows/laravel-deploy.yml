name: Laravel CI/CD -> FTPS (Optimized Deploy)

on:
  push:
    branches: [staging]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================
      # 1. Setup PHP and Composer
      # ============================================
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4" # Laravel 12 requires >=8.2
          extensions: mbstring, bcmath, openssl, pdo_mysql, tokenizer, xml, fileinfo
          ini-values: memory_limit=1024M

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('**/composer.lock') }}

      - name: Install composer dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      # ============================================
      # 2. Prepare Deploy Folder
      # ============================================
      - name: Build production bundle
        run: |
          rm -rf deploy || true
          mkdir deploy
          rsync -av \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=.github \
            --exclude=tests \
            --exclude=storage/logs \
            --exclude=storage/framework/views \
            --exclude=public \
            --exclude=.env \
            ./ deploy/

          # Create required folders
          mkdir -p deploy/storage deploy/bootstrap/cache
          cp -r vendor deploy/vendor

      - name: Zip bundle
        run: |
          cd deploy
          zip -rq ../deploy.zip .
          cd ..
          ls -lh deploy.zip

      # ============================================
      # 3. Upload ONLY ONE FILE via FTPS
      # ============================================
      - name: Upload deploy.zip (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          port: ${{ secrets.FTP_PORT || 21 }}
          local-dir: ./ # upload just deploy.zip
          server-dir: ${{ secrets.FTP_PATH_LARAVEL }}/
          include: "deploy.zip"
          exclude: "**"

      # ============================================
      # 4. Extract and Activate (Atomic Deploy)
      # ============================================
      - name: Extract deploy on server + atomic switch
        run: |
          sudo apt-get update && sudo apt-get install -y lftp

          lftp -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASS }}" -e "
            set ftps:initial-prot '';
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;

            # Go to target path
            cd ${{ secrets.FTP_PATH_LARAVEL }}

            # Create new release folder
            mkdir release_$(date +%s)
            cd release_$(date +%s)

            # Unzip deploy.zip
            unzip ../deploy.zip

            # Switch symlink
            rm -f current
            ln -s release_$(date +%s) current

            bye
          " ${{ secrets.FTP_SERVER }}
