name: Laravel CI/CD -> SFTP (zip upload)

on:
  push:
    branches: [staging]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          echo "${{ secrets.FTP_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: mbstring, bcmath, openssl, pdo_mysql, tokenizer, xml, fileinfo

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('**/composer.lock') }}

      - name: Install composer dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Prepare release folder
        run: |
          rm -rf release || true
          mkdir -p release
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='public' \
            --exclude='.env' \
            ./ release/
          rsync -av vendor/ release/vendor/
          mkdir -p release/storage release/bootstrap/cache
          ls -la release

      - name: Zip release
        run: |
          cd release
          zip -r ../release.zip . >/dev/null
          cd ..
          ls -lh release.zip

            - name: Upload release.zip to server (SCP, no host check)
        run: |
          echo "${{ secrets.FTP_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -P "${{ secrets.FTP_PORT }}" release.zip "${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_SERVER }}:/tmp"

      - name: Unzip on server and move to target (ssh, no host check)
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_rsa -p "${{ secrets.FTP_PORT }}" "${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_SERVER }}" <<'SSH_EOF'
            set -e
            TARGET_DIR="${{ secrets.FTP_PATH_LARAVEL }}"
            mkdir -p "$TARGET_DIR"
            if [ -d "$TARGET_DIR" ]; then
              mv "$TARGET_DIR" "${TARGET_DIR}_backup_$(date +%s)" || true
            fi
            unzip -o /tmp/release.zip -d "$TARGET_DIR"
            rm -f /tmp/release.zip
            chmod -R 775 "$TARGET_DIR/storage" "$TARGET_DIR/bootstrap/cache" || true
            cd "$TARGET_DIR"
            # optional composer/migrate
            composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader || true
            php artisan migrate --force || true
            php artisan config:cache || true
            php artisan route:cache || true
            php artisan view:cache || true
            echo "Post-deploy done."
          SSH_EOF


      - name: Run post-deploy commands (composer migrate + optimize)
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          key: ${{ secrets.FTP_SSH_KEY }}
          port: ${{ secrets.FTP_PORT }}
          script: |
            set -e
            cd "${{ secrets.FTP_PATH_LARAVEL }}"
            # jika vendor belum terinstall di server, lakukan composer install (opsional)
            composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader || true
            php artisan migrate --force || true
            php artisan config:cache || true
            php artisan route:cache || true
            php artisan view:cache || true
            echo "Post-deploy tasks done."
