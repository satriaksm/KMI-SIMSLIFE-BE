name: Deploy Backend to Server

on:
  push:
    branches: [staging]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare target dir
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            sudo mkdir -p /var/www/KMI-SIMSLIFE-BE
            sudo chown -R "$USER:$USER" /var/www/KMI-SIMSLIFE-BE

      - name: Upload app to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          overwrite: true
          target: /var/www/KMI-SIMSLIFE-BE
          source: app,bootstrap,config,database,public,resources,routes,artisan,composer.json,composer.lock

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          debug: true
          command_timeout: 30m
          script: |
            set -Eeuo pipefail
            REPO_DIR=/var/www/KMI-SIMSLIFE-BE
            cd "$REPO_DIR"

            mkdir -p storage/{app,framework/{cache,sessions,views},logs} bootstrap/cache

            composer install --prefer-dist --no-interaction --optimize-autoloader

            # penting: paksa Laravel baca .env terbaru
            php artisan optimize:clear

            # set permission sebelum artisan jalan
            sudo chown -R www-data:www-data storage bootstrap/cache
            sudo find storage -type d -exec chmod 775 {} \;
            sudo find storage -type f -exec chmod 664 {} \;
            sudo chmod -R ug+rwX bootstrap/cache

            # migrate (tanpa seeder/factory di production)
            php artisan migrate --force

            php artisan config:cache
            php artisan route:cache

            sudo systemctl reload php8.3-fpm || sudo systemctl restart php8.3-fpm
            sudo systemctl reload nginx || sudo systemctl restart nginx
