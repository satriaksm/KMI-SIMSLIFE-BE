name: Laravel CI/CD -> FTPS

on:
  push:
    branches: [prod-kel-banyuanyar]
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, bcmath, openssl, pdo_mysql, tokenizer, xml, fileinfo
          ini-values: post_max_size=256M, upload_max_filesize=256M, memory_limit=1024M

      - name: Install Composer dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader
          composer dump-autoload --optimize

      - name: Setup .env from secrets
        run: |
          cp .env.example .env
          sed -i "s|^APP_NAME=.*|APP_NAME=${{ secrets.APP_NAME }}|" .env
          sed -i "s|^APP_DEBUG=.*|APP_DEBUG=false|" .env
          sed -i "s|^APP_URL=.*|APP_URL=${{ secrets.APP_URL }}|" .env
          sed -i "s|^SANCTUM_STATEFUL_DOMAINS=.*|SANCTUM_STATEFUL_DOMAINS=${{ secrets.SANCTUM_STATEFUL_DOMAINS }}|" .env
          sed -i "s|^FRONTEND_URL=.*|FRONTEND_URL=${{ secrets.FRONTEND_URL }}|" .env
          sed -i "s|^DB_HOST=.*|DB_HOST=${{ secrets.DB_HOST }}|" .env
          sed -i "s|^DB_PORT=.*|DB_PORT=${{ secrets.DB_PORT }}|" .env
          sed -i "s|^DB_DATABASE=.*|DB_DATABASE=${{ secrets.DB_DATABASE }}|" .env
          sed -i "s|^DB_USERNAME=.*|DB_USERNAME=${{ secrets.DB_USERNAME }}|" .env
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=${{ secrets.DB_PASSWORD }}|" .env
          sed -i "s|^MAIL_MAILER=.*|MAIL_MAILER=${{ secrets.MAIL_MAILER }}|" .env
          sed -i "s|^MAIL_SCHEME=.*|MAIL_SCHEME=${{ secrets.MAIL_SCHEME }}|" .env
          sed -i "s|^MAIL_HOST=.*|MAIL_HOST=${{ secrets.MAIL_HOST }}|" .env
          sed -i "s|^MAIL_PORT=.*|MAIL_PORT=${{ secrets.MAIL_PORT }}|" .env
          sed -i "s|^MAIL_USERNAME=.*|MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}|" .env
          sed -i "s|^MAIL_PASSWORD=.*|MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}|" .env
          sed -i "s|^MAIL_FROM_ADDRESS=.*|MAIL_FROM_ADDRESS=${{ secrets.MAIL_FROM_ADDRESS }}|" .env
          sed -i "s|^MAIL_FROM_NAME=.*|MAIL_FROM_NAME=${{ secrets.APP_NAME }}|" .env
          php artisan key:generate --force

      - name: Prepare release folder
        run: |
          rm -rf release || true
          mkdir -p release

          # ✅ Copy source code (exclude vendor, node_modules, tests, etc)
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='/vendor' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='public' \
            --exclude='/.scribe' \
            --exclude='/.scribe/**' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            ./ release/

          # ✅ Create necessary directories
          mkdir -p release/storage/{app,framework,logs}
          mkdir -p release/storage/framework/{cache,sessions,views}
          mkdir -p release/bootstrap/cache

          echo "📦 Release contents:"
          ls -lah release/
          echo ""
          echo "📊 Release size:"
          du -sh release/

      - name: Deploy to FTPS (Source Code)
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_IP }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASS }}
          port: ${{ secrets.FTP_PORT}}
          protocol: ftps
          local-dir: release/
          server-dir: ${{ secrets.FTP_PATH_LARAVEL }}/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.scribe
            **/.scribe/**
            **/node_modules/**
            /vendor/**
            **/tests/**

      - name: Deployment Summary
        if: success()
        run: |
          echo "### ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY

      - name: Deployment Failed
        if: failure()
        run: |
          echo "### ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please check the logs above for details." >> $GITHUB_STEP_SUMMARY
